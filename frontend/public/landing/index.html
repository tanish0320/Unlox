<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chalkboard Greetings Animation</title>
    
    <!-- Google Fonts for English and Indian Scripts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Kalam:wght@400;700&family=Noto+Sans+Kannada:wght@600;800&family=Noto+Sans+Tamil:wght@600;800&family=Noto+Sans+Telugu:wght@600;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Fullscreen Plain Greenboard -->
    <div class="fullscreen-chalkboard" id="fullscreen-board">
        <div class="board-frame-border">
            <!-- Brass Corner Screws -->
            <div class="frame-screw top-left"></div>
            <div class="frame-screw top-right"></div>
            <div class="frame-screw bottom-left"></div>
            <div class="frame-screw bottom-right"></div>

            <!-- Slate Greenboard Surface -->
            <div class="slate-board" id="slate-board">
                <!-- Ambient Classroom Spotlight -->
                <div class="slate-spotlight"></div>

                <!-- Chalk Handwriting and Falling Powder Canvas -->
                <div id="chalkboard-canvas-container"></div>

                <!-- Discreet Skip Button Option -->
                <button id="skip-intro-btn" class="skip-btn" aria-label="Skip chalkboard intro">
                    <span>Skip</span>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="5 4 15 12 5 20 5 4"></polygon>
                        <line x1="19" y1="5" x2="19" y2="19"></line>
                    </svg>
                </button>

                <!-- Wooden Chalk Tray at Bottom for Falling Powder Accumulation -->
                <div class="chalk-tray">
                    <div class="tray-chalk-box">
                        <div class="tray-chalk white"></div>
                        <div class="tray-chalk yellow"></div>
                        <div class="tray-chalk cyan"></div>
                        <div class="tray-chalk pink"></div>
                    </div>
                    <div class="tray-duster"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="sound-effects.js"></script>
    <script src="chalk-board.js"></script>
    <script src="landing.js"></script>
</body>
</html>
